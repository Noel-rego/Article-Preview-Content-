<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Preview Content</title>
    <link rel="preconnect" href="https://fonts.google.com/specimen/Manrope">
    <link rel="stylesheet" href="https://googleapis.com" >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>

    </header>
    <main>
        <div class="main-box">
            <div class="bigImg"></div>
            <div class="main-Body">
                <p class="bodyPart" id="heading">Shift the overall look and feel by adding these wonderful touches to furniture in your home</p>
                <p class="bodyPart" id="description">Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I’ve got some simple tips to help you make any room feel complete.</p>
                
             <div class="endBody">
                <div >
                    <img class="profile" src="avatar-michelle.jpg" alt="profile-Pic"/>
                </div>
                <div class="index">
                    <span class="author-name">Michelle Appleton</span>
                    <div class="publish-date">28 Jun 2020</div>
                </div>
            <div class="share">
                <div class="invisibleButtons">
                  <div class="invisibleButton" id="invisibleButton">
                    <span class="share-text">SHARE</span>
                    <a class="popup">
                        <img src="icon-facebook.svg" alt="shareIcon"/></a>
                    <a class="popup">
                        <img src="icon-twitter.svg" alt="twitterIcon"/></a>
                    <a class="popup">
                        <img src="icon-pinterest.svg" alt="pinterestIcon"/></a>
                    
                  </div>
                  <div class="popup-arrow"></div>
                </div>
                 <div class="button">
                    <button class="share-btn">
                        <i class="fa-solid fa-share"></i>
                    </button>
                 </div>
            </div>
               
                
             </div>
        </div>
        
    </main>
    <footer>

    </footer>
    <script src="first.js"></script>
</body>
</html>
